name: Beta Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BETA_VERSION: 0.3.0-beta.${{ github.run_number }}

jobs:
  quality-and-package:
    name: Test, validate, and package production Beta
    if: github.repository == 'HiDream-ai/vivago-agent-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOCACHE: ${{ github.workspace }}/.ci-beta-go-cache
      DIST_ROOT: ${{ github.workspace }}/.ci-beta-dist
      CODEX_VALIDATOR: ${{ github.workspace }}/.ci-beta-validate-plugin.py
      CODEX_VALIDATOR_SHA256: ebda00d55d7518b127f675f062fb5c6e7a1ffdc0a99df1a55ac594400d7d3228
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.12
          cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node.js for Claude Code validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install validation dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Fetch pinned official Codex plugin validator
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${CODEX_VALIDATOR}" \
            https://raw.githubusercontent.com/openai/codex/e75a1888d7e91ce56fc90d0edd32a9e6a8974686/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py
          printf '%s  %s\n' "${CODEX_VALIDATOR_SHA256}" "${CODEX_VALIDATOR}" \
            | sha256sum --check

      - name: Run default Go tests
        run: go test ./...

      - name: Run prod-profile Go tests
        run: go test -tags prod ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run distribution and workflow tests
        run: python -m unittest discover -s tests -v

      - name: Validate source plugin for Codex
        run: python "${CODEX_VALIDATOR}" plugin

      - name: Build six production Beta binaries
        run: |
          set -euo pipefail
          python scripts/build_beta_binaries.py \
            --output "${DIST_ROOT}/binaries" \
            --version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}"

      - name: Assemble production Marketplace
        run: |
          set -euo pipefail
          python scripts/assemble_beta_distribution.py \
            --plugin-template plugin \
            --binary-root "${DIST_ROOT}/binaries" \
            --output "${DIST_ROOT}/marketplace" \
            --version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}"

      - name: Verify production provenance and environment boundary
        run: |
          set -euo pipefail
          python scripts/verify_beta_distribution.py \
            --marketplace "${DIST_ROOT}/marketplace" \
            --version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}"

      - name: Validate assembled plugin for Codex
        run: python "${CODEX_VALIDATOR}" "${DIST_ROOT}/marketplace/plugins/vivago-agent-cli"

      - name: Validate assembled Marketplace for Claude Code
        run: npx --yes --package @anthropic-ai/claude-code@2.1.220 -- claude plugin validate "${DIST_ROOT}/marketplace"

      - name: Generate SPDX SBOM
        run: |
          python scripts/generate_spdx_sbom.py \
            --marketplace "${DIST_ROOT}/marketplace" \
            --go-mod go.mod \
            --requirements requirements-dev.txt \
            --version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --created "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --output "${DIST_ROOT}/marketplace/SBOM.spdx.json"

      - name: Build synthetic lower production Beta for lifecycle tests
        run: |
          set -euo pipefail
          PREVIOUS_VERSION="$(python scripts/derive_previous_beta_version.py --version "${BETA_VERSION}")"
          python scripts/build_beta_binaries.py \
            --output "${DIST_ROOT}/previous-binaries" \
            --version "${PREVIOUS_VERSION}" \
            --source-revision "${GITHUB_SHA}"
          python scripts/assemble_beta_distribution.py \
            --plugin-template plugin \
            --binary-root "${DIST_ROOT}/previous-binaries" \
            --output "${DIST_ROOT}/previous-marketplace" \
            --version "${PREVIOUS_VERSION}" \
            --source-revision "${GITHUB_SHA}"
          python scripts/verify_beta_distribution.py \
            --marketplace "${DIST_ROOT}/previous-marketplace" \
            --version "${PREVIOUS_VERSION}" \
            --source-revision "${GITHUB_SHA}"

      - name: Create mode-preserving Beta archive
        run: |
          set -euo pipefail
          tar -C "${DIST_ROOT}/marketplace" -czf \
            "${DIST_ROOT}/vivago-beta-${BETA_VERSION}-${GITHUB_SHA}.tar.gz" .
          tar -C "${DIST_ROOT}/previous-marketplace" -czf \
            "${DIST_ROOT}/vivago-beta-previous.tar.gz" .

      - name: Upload production Beta candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vivago-beta-${{ env.BETA_VERSION }}-${{ github.sha }}
          path: |
            ${{ env.DIST_ROOT }}/vivago-beta-${{ env.BETA_VERSION }}-${{ github.sha }}.tar.gz
            ${{ env.DIST_ROOT }}/vivago-beta-previous.tar.gz
          if-no-files-found: error
          retention-days: 14

  native-platform-smoke:
    name: Native Beta smoke (${{ matrix.target }})
    needs: quality-and-package
    if: github.repository == 'HiDream-ai/vivago-agent-cli'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
          - target: darwin-amd64
            runner: macos-26-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: windows-arm64
            runner: windows-11-arm
          - target: windows-amd64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      NATIVE_ROOT: ${{ github.workspace }}/.ci-beta-native
    steps:
      - name: Check out native verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download shared production Beta Marketplace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vivago-beta-${{ env.BETA_VERSION }}-${{ github.sha }}
          path: ${{ env.NATIVE_ROOT }}

      - name: Run native production launcher smoke
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_beta_native_platform.py \
            --archive "${NATIVE_ROOT}/vivago-beta-${BETA_VERSION}-${GITHUB_SHA}.tar.gz" \
            --expected-target "${{ matrix.target }}" \
            --version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --report "${NATIVE_ROOT}/native-${{ matrix.target }}.json"

      - name: Upload native Beta smoke report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vivago-beta-native-${{ matrix.target }}-${{ github.sha }}
          path: ${{ env.NATIVE_ROOT }}/native-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  host-plugin-lifecycle:
    name: Beta host lifecycle (${{ matrix.target }}, ${{ matrix.host }})
    needs: quality-and-package
    if: github.repository == 'HiDream-ai/vivago-agent-cli'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: darwin-arm64
            runner: macos-26
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
          - target: darwin-amd64
            runner: macos-26-intel
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: darwin-amd64
            runner: macos-26-intel
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
          - target: linux-amd64
            runner: ubuntu-24.04
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: linux-amd64
            runner: ubuntu-24.04
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
          - target: windows-arm64
            runner: windows-11-arm
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: windows-arm64
            runner: windows-11-arm
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
          - target: windows-amd64
            runner: windows-2025
            host: codex
            package: "@openai/codex@0.147.0"
            host-version: "0.147.0"
          - target: windows-amd64
            runner: windows-2025
            host: claude-code
            package: "@anthropic-ai/claude-code@2.1.220"
            host-version: "2.1.220"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      HOST_ROOT: ${{ github.workspace }}/.ci-beta-host
    steps:
      - name: Check out lifecycle verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Download candidate and synthetic previous Beta
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vivago-beta-${{ env.BETA_VERSION }}-${{ github.sha }}
          path: ${{ env.HOST_ROOT }}/input

      - name: Install pinned host
        run: npm install --global "${{ matrix.package }}"

      - name: Verify isolated install, upgrade, rollback, and re-upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOST_ROOT}/previous-marketplace"
          python -m tarfile -e "${HOST_ROOT}/input/vivago-beta-previous.tar.gz" \
            "${HOST_ROOT}/previous-marketplace"
          python scripts/verify_beta_host_plugin_lifecycle.py \
            --archive "${HOST_ROOT}/input/vivago-beta-${BETA_VERSION}-${GITHUB_SHA}.tar.gz" \
            --previous-marketplace "${HOST_ROOT}/previous-marketplace" \
            --expected-target "${{ matrix.target }}" \
            --host "${{ matrix.host }}" \
            --host-version "${{ matrix.host-version }}" \
            --candidate-version "${BETA_VERSION}" \
            --source-revision "${GITHUB_SHA}" \
            --report "${HOST_ROOT}/reports/host-${{ matrix.target }}-${{ matrix.host }}.json"

      - name: Upload Beta host lifecycle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-host-lifecycle-${{ matrix.target }}-${{ matrix.host }}-${{ github.sha }}
          path: ${{ env.HOST_ROOT }}/reports/host-${{ matrix.target }}-${{ matrix.host }}.json
          if-no-files-found: warn
          retention-days: 14
